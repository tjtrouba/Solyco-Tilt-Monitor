name: Update Tilt Monitor Data
on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch FRED data and build data.json
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node fetch-data.js
      - name: Commit data.json if it changed
        run: |
          git config user.name "Solyco Tilt Monitor"
          git config user.email "actions@github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "Update tilt data" && git push)
